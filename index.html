        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tab-btn' + (sec === activeSector ? ' active' : '');
        btn.innerHTML = `${sec} <span class="tab-count">${count}</span>`;
        btn.addEventListener('click', () => {
          activeSector = sec;
          populateCategoryFilter();
          renderTabs();
          renderCatalog();
        });
        sectorTabsEl.appendChild(btn);
      });
    }

    function populateCategoryFilter() {
      const scoped = activeSector === 'ALL'
        ? catalog
        : catalog.filter((c) => c.sector === activeSector);
      const cats = [...new Set(scoped.map((c) => c.category).filter(Boolean))].sort();
      categoryFilterEl.innerHTML = '<option value="ALL">All Sub-Categories</option>';
      cats.forEach((cat) => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        categoryFilterEl.appendChild(opt);
      });
    }

    function getFilteredItems() {
      const q = (searchInputEl.value || '').trim().toLowerCase();
      const cat = categoryFilterEl.value;
      const st = statusFilterEl.value;

      return catalog.filter((item) => {
        if (activeSector !== 'ALL' && item.sector !== activeSector) return false;
        if (cat !== 'ALL' && item.category !== cat) return false;
        const prog = getItemProgress(item);
        if (st !== 'ALL' && prog.status !== st) return false;
        if (!q) return true;
        const hay = `${item.uid} ${item.code} ${item.name} ${item.authority} ${item.category} ${item.notes}`.toLowerCase();
        return hay.includes(q);
      });
    }

    function updateCalculator(items) {
      const showCalc = activeSector === 'TRADE';
      tradeCalcEl.classList.toggle('visible', showCalc);
      if (!showCalc) return;

      const target = Math.max(0, Number(calcTargetHoursEl.value) || 0);
      let loggedHours = 0;
      let blocksDone = 0;
      items.forEach((item) => {
        const p = getItemProgress(item);
        loggedHours += Number(p.otj_hours) || 0;
        blocksDone += Number(p.blocks_completed) || 0;
      });
      document.getElementById('calcLoggedHours').textContent = loggedHours.toLocaleString();
      document.getElementById('calcRemainingHours').textContent = Math.max(0, target - loggedHours).toLocaleString();
      document.getElementById('calcBlocksDone').textContent = String(blocksDone);
    }

    async function saveItem(uid, status, otjHours, blocksCompleted, msgEl) {
      const cleanHours = Math.max(0, Number(otjHours) || 0);
      const cleanBlocks = Math.max(0, parseInt(blocksCompleted, 10) || 0);

      userProgressMap[uid] = {
        status,
        otj_hours: cleanHours,
        blocks_completed: cleanBlocks
      };
      localStorage.setItem('pocketcredit_local_progress', JSON.stringify(userProgressMap));

      if (!sbClient || !currentUser) {
        msgEl.textContent = 'Saved locally (sign in for cloud sync)';
        updateCalculator(getFilteredItems());
        return;
      }

      msgEl.textContent = 'Syncing...';
      const { error } = await sbClient
        .from('user_credentials')
        .upsert(
          {
            user_id: currentUser.id,
            cred_uid: uid,
            status,
            otj_hours: cleanHours,
            blocks_completed: cleanBlocks,
            updated_at: new Date().toISOString()
          },
          { onConflict: 'user_id,cred_uid' }
        );

      if (error) {
        msgEl.style.color = 'var(--danger)';
        msgEl.textContent = `Sync error: ${error.message}`;
      } else {
        msgEl.style.color = 'var(--accent-2)';
        msgEl.textContent = 'Saved to Supabase';
      }
      updateCalculator(getFilteredItems());
    }

    function renderCatalog() {
      const items = getFilteredItems();
      updateCalculator(items);
      catalogGridEl.innerHTML = '';

      if (!items.length) {
        catalogGridEl.innerHTML = '<p style="color:var(--muted);">No matching credentials found.</p>';
        return;
      }

      items.forEach((item) => {
        const prog = getItemProgress(item);
        const card = document.createElement('article');
        card.className = 'card';

        card.innerHTML = `
          <div>
            <div class="card-top">
              <span class="uid">${item.uid} · ${item.code || 'N/A'}</span>
              <span class="badge">${item.sector}</span>
            </div>
            <h3 class="card-title">${item.name}</h3>
            <div class="card-meta">${item.authority} · ${item.category}</div>
            <p class="card-notes" style="margin-top:6px;">${item.notes || ''}</p>
          </div>

          <div class="card-inputs">
            <label>
              Status
              <select class="inp-status">
                ${['Not Started', 'In Progress', 'Completed', 'Renewal Due'].map((s) =>
                  `<option value="${s}" ${prog.status === s ? 'selected' : ''}>${s}</option>`
                ).join('')}
              </select>
            </label>
            <label>
              OTJ Hours
              <input class="inp-hours" type="number" min="0" step="10" value="${prog.otj_hours}" />
            </label>
            <label>
              Blocks
              <input class="inp-blocks" type="number" min="0" step="1" value="${prog.blocks_completed}" />
            </label>
          </div>

          <div class="card-actions">
            <span class="save-msg"></span>
            <button class="btn btn-small btn-primary save-btn" type="button">Save</button>
          </div>
        `;

        const statusSel = card.querySelector('.inp-status');
        const hoursInp = card.querySelector('.inp-hours');
        const blocksInp = card.querySelector('.inp-blocks');
        const saveBtn = card.querySelector('.save-btn');
        const msgEl = card.querySelector('.save-msg');

        saveBtn.addEventListener('click', () => {
          saveItem(item.uid, statusSel.value, hoursInp.value, blocksInp.value, msgEl);
        });

        catalogGridEl.appendChild(card);
      });
    }

    async function loadCatalogJson() {
      try {
        const res = await fetch('./data/catalog.json', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const jsonData = await res.json();
        if (Array.isArray(jsonData) && jsonData.length > 0) {
          catalog = jsonData;
          bannerEl.textContent = `Loaded ${catalog.length} credentials from ./data/catalog.json`;
        } else {
          bannerEl.textContent = `Loaded ${catalog.length} embedded credentials`;
        }
      } catch (_err) {
        bannerEl.textContent = `Loaded ${catalog.length} embedded credentials (offline/fallback mode)`;
      }
      populateCategoryFilter();
      renderTabs();
      renderCatalog();
    }

    async function loadCloudProgress() {
      if (!sbClient || !currentUser) return;
      const { data, error } = await sbClient
        .from('user_credentials')
        .select('cred_uid, status, otj_hours, blocks_completed')
        .eq('user_id', currentUser.id);

      if (!error && Array.isArray(data)) {
        data.forEach((row) => {
          userProgressMap[row.cred_uid] = {
            status: row.status,
            otj_hours: row.otj_hours,
            blocks_completed: row.blocks_completed
          };
        });
        renderCatalog();
      }
    }

    googleLoginBtn.addEventListener('click', async () => {
      if (!sbClient) return;
      await sbClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: SITE_URL }
      });
    });

    signOutBtn.addEventListener('click', async () => {
      if (!sbClient) return;
      await sbClient.auth.signOut();
    });

    async function initAuth() {
      try {
        const localSaved = JSON.parse(localStorage.getItem('pocketcredit_local_progress') || '{}');
        if (localSaved && typeof localSaved === 'object') {
          userProgressMap = { ...localSaved };
        }
      } catch (_e) {}

      if (!sbClient) return;
      const { data: { session } } = await sbClient.auth.getSession();
      currentUser = session?.user ?? null;
      updateAuthUI();
      if (currentUser) await loadCloudProgress();

      sbClient.auth.onAuthStateChange(async (_event, nextSession) => {
        currentUser = nextSession?.user ?? null;
        updateAuthUI();
        if (currentUser) {
          await loadCloudProgress();
        } else {
          renderCatalog();
        }
      });
    }

    function updateAuthUI() {
      if (currentUser) {
        authStatusEl.textContent = `Signed in: ${currentUser.email || currentUser.id}`;
        googleLoginBtn.style.display = 'none';
        signOutBtn.style.display = 'inline-block';
      } else {
        authStatusEl.textContent = 'Signed out (local preview)';
        googleLoginBtn.style.display = 'inline-block';
        signOutBtn.style.display = 'none';
      }
    }

    searchInputEl.addEventListener('input', renderCatalog);
    categoryFilterEl.addEventListener('change', renderCatalog);
    statusFilterEl.addEventListener('change', renderCatalog);
    calcTargetHoursEl.addEventListener('input', () => updateCalculator(getFilteredItems()));

    loadCatalogJson().then(initAuth);
  </script>
</body>
</html>
